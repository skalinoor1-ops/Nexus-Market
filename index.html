<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aura | Intelligence</title>
    <style>
        :root {
            --bg: #ffffff;
            --text: #1d1d1f;
            --subtext: #86868b;
            --accent: #0071e3;
            --search-bg: #f5f5f7;
            --shadow: 0 4px 20px rgba(0,0,0,0.08);
        }

        body {
            margin: 0;
            background-color: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        /* Top Navigation Mockup */
        nav {
            width: 100%;
            padding: 20px;
            display: flex;
            justify-content: flex-end;
            gap: 20px;
            box-sizing: border-box;
        }

        nav a {
            text-decoration: none;
            color: var(--text);
            font-size: 14px;
            font-weight: 400;
        }

        /* Main Search Section */
        .main {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 90%;
            max-width: 600px;
            margin-top: -10vh;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 40px;
        }

        .logo-text {
            font-size: 48px;
            font-weight: 700;
            letter-spacing: -1.5px;
            background: linear-gradient(180deg, #1d1d1f 0%, #434343 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* The Search Bar */
        .search-wrapper {
            position: relative;
            width: 100%;
            display: flex;
            align-items: center;
        }

        .search-bar {
            width: 100%;
            padding: 18px 25px 18px 55px;
            font-size: 18px;
            border-radius: 30px;
            border: 1px solid transparent;
            background-color: var(--search-bg);
            color: var(--text);
            outline: none;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: inset 0 0 0 1px rgba(0,0,0,0.02);
        }

        .search-bar:focus {
            background-color: #fff;
            border-color: #d2d2d7;
            box-shadow: var(--shadow);
        }

        /* SVG Icons */
        .icon-search {
            position: absolute;
            left: 20px;
            width: 20px;
            height: 20px;
            fill: var(--subtext);
        }

        .icon-mic {
            position: absolute;
            right: 20px;
            width: 20px;
            height: 20px;
            fill: var(--accent);
            cursor: pointer;
        }

        /* UI Buttons */
        .button-group {
            margin-top: 30px;
            display: flex;
            gap: 12px;
        }

        .btn {
            padding: 10px 24px;
            border-radius: 20px;
            border: none;
            background-color: var(--search-bg);
            color: var(--text);
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn:hover {
            background-color: #e8e8ed;
        }

        /* Footer */
        footer {
            padding: 20px;
            color: var(--subtext);
            font-size: 12px;
            width: 100%;
            text-align: center;
            border-top: 1px solid #f2f2f2;
        }
    </style>
</head>
<body>

    <nav>
        <a href="#">Images</a>
        <a href="#">Maps</a>
        <svg height="24" viewBox="0 0 24 24" width="24"><path d="M6,8c1.1,0,2-0.9,2-2s-0.9-2-2-2S4,4.9,4,6S4.9,8,6,8z M12,20c1.1,0,2-0.9,2-2s-0.9-2-2-2s-0.9,2-2,2S10.9,20,12,20z M6,20 c1.1,0,2-0.9,2-2s-0.9-2-2-2s-0.9,2-2,2S4.9,20,6,20z M6,14c1.1,0,2-0.9,2-2s-0.9-2-2-2s-0.9,2-2,2S4.9,14,6,14z M12,14 c1.1,0,2-0.9,2-2s-0.9-2-2-2s-0.9,2-2,2S10.9,14,12,14z M18,8c1.1,0,2-0.9,2-2s-0.9-2-2-2s-2,0.9-2,2S16.9,8,18,8z M12,8 c1.1,0,2-0.9,2-2s-0.9-2-2-2s-2,0.9-2,2S10.9,8,12,8z M18,14c1.1,0,2-0.9,2-2s-0.9-2-2-2s-2,0.9-2,2S16.9,14,18,14z M18,20 c1.1,0,2-0.9,2-2s-0.9-2-2-2s-2,0.9-2,2S16.9,20,18,20z" fill="#5f6368"/></svg>
    </nav>

    <div class="main">
        <div class="logo">
            <svg width="50" height="50" viewBox="0 0 100 100">
                <defs>
                    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" style="stop-color:#0071e3;stop-opacity:1" />
                        <stop offset="100%" style="stop-color:#00d4ff;stop-opacity:1" />
                    </linearGradient>
                </defs>
                <circle cx="50" cy="50" r="40" stroke="url(#grad)" stroke-width="8" fill="none" />
                <circle cx="50" cy="50" r="15" fill="url(#grad)" />
            </svg>
            <span class="logo-text">Aura</span>
        </div>

        <div class="search-wrapper">
            <svg class="icon-search" viewBox="0 0 24 24">
                <path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
            </svg>
            
            <input type="text" id="mainSearch" class="search-bar" placeholder="Search the universal web..." autofocus>
            
            <svg class="icon-mic" viewBox="0 0 24 24">
                <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/><path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/>
            </svg>
        </div>

        <div class="button-group">
            <button class="btn" onclick="executeSearch()">Aura Search</button>
            <button class="btn" onclick="window.location.reload()">Reset Engine</button>
        </div>
    </div>

    <footer>
        United States &bull; Privacy &bull; Terms &bull; Settings
    </footer>

    <script>
        const input = document.getElementById('mainSearch');

        // Logic to make it a "Real" search engine
        function executeSearch() {
            const query = input.value;
            if (query.trim() !== "") {
                // This routes your clean UI to a real global index 
                // without the "trash" feel of a local list.
                window.location.href = `https://www.bing.com/search?q=${encodeURIComponent(query)}`;
            }
        }

        // Search on 'Enter' key
        input.addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                executeSearch();
            }
        });
    </script>
</body>
                                                            </html>
