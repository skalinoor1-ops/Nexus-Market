<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NEXUS | Pro Marketplace</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

    <style>
        :root {
            --primary: #2563eb; /* Royal Blue */
            --bg-body: #f8fafc;
            --bg-card: #ffffff;
            --text-main: #0f172a;
            --text-sub: #64748b;
            --border: #e2e8f0;
            --success: #10b981;
            --verified: #3b82f6;
            --shadow: 0 4px 12px rgba(0,0,0,0.05);
            --radius: 16px;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body { 
            margin: 0; padding: 0; 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background-color: var(--bg-body); 
            color: var(--text-main);
            padding-bottom: 90px;
        }

        /* --- NAVBAR --- */
        nav { 
            position: sticky; top: 0; z-index: 100; 
            background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border);
            padding: 15px 20px;
            display: flex; justify-content: space-between; align-items: center;
        }
        .logo { font-weight: 800; font-size: 1.4rem; letter-spacing: -0.5px; color: var(--primary); display: flex; align-items: center; gap: 8px; }
        
        .nav-controls { display: flex; gap: 10px; align-items: center; }
        .btn-game {
            background: #f1f5f9; color: var(--text-main); border: 1px solid var(--border);
            padding: 8px 12px; border-radius: 50px; font-weight: 700; font-size: 0.8rem; cursor: pointer;
        }
        .btn-create {
            background: var(--text-main); color: white; border: none;
            padding: 10px 18px; border-radius: 50px; font-weight: 700; font-size: 0.85rem;
            cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        /* --- FILTERS --- */
        .filters {
            display: flex; gap: 10px; overflow-x: auto; padding: 20px; scrollbar-width: none;
        }
        .chip {
            white-space: nowrap; padding: 10px 20px; border-radius: 50px;
            background: var(--bg-card); border: 1px solid var(--border); 
            font-size: 0.9rem; font-weight: 600; color: var(--text-sub); 
            cursor: pointer; box-shadow: var(--shadow); transition: 0.2s;
        }
        .chip.active { background: var(--primary); color: white; border-color: var(--primary); }

        /* --- GRID --- */
        .container { padding: 0 20px; max-width: 800px; margin: 0 auto; }
        .empty-state {
            text-align: center; margin-top: 60px; padding: 40px; background: white;
            border-radius: 20px; border: 2px dashed var(--border); color: var(--text-sub);
        }

        .card {
            background: var(--bg-card); border-radius: var(--radius); padding: 20px;
            margin-bottom: 20px; border: 1px solid var(--border);
            box-shadow: var(--shadow); transition: 0.2s; position: relative;
        }
        
        .card-header { display: flex; justify-content: space-between; align-items: start; margin-bottom: 12px; }
        .user-block { display: flex; gap: 12px; align-items: center; }
        .avatar {
            width: 50px; height: 50px; border-radius: 12px;
            background: #f1f5f9; color: var(--primary);
            display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 1.2rem;
        }
        
        /* VERIFIED BADGE */
        .verified-badge { color: var(--verified); font-size: 0.9rem; margin-left: 4px; }

        .status-dot {
            font-size: 0.75rem; font-weight: 700; padding: 6px 12px; border-radius: 50px;
            display: flex; align-items: center; gap: 6px;
        }
        .st-online { background: #dcfce7; color: #15803d; }
        .st-offline { background: #f1f5f9; color: #64748b; }
        .dot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; }

        .desc-text { font-size: 0.9rem; color: var(--text-sub); line-height: 1.5; margin-bottom: 15px; 
            display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
        }

        .price-row { display: flex; justify-content: space-between; align-items: flex-end; margin-top: 10px; }
        .price { font-size: 1.5rem; font-weight: 800; color: var(--text-main); }
        .rating-box { font-size: 0.9rem; font-weight: 700; padding: 6px 10px; border-radius: 8px; background: #fffbeb; color: #d97706; }

        .btn-hire {
            width: 100%; padding: 14px; margin-top: 15px;
            background: var(--primary); color: white; border: none; border-radius: 12px;
            font-weight: 700; font-size: 1rem; cursor: pointer;
            box-shadow: 0 4px 10px rgba(37, 99, 235, 0.2);
        }

        /* --- MODALS --- */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6); backdrop-filter: blur(4px); z-index: 200;
            display: flex; align-items: flex-end; justify-content: center;
        }
        .hidden { display: none !important; }
        
        .modal-box {
            background: white; width: 100%; max-width: 500px;
            border-radius: 24px 24px 0 0; padding: 30px; 
            box-shadow: 0 -10px 40px rgba(0,0,0,0.1);
            animation: slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }
        @media(min-width: 768px) { .modal-box { border-radius: 24px; margin-bottom: 40px; } }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }

        .form-group { margin-bottom: 15px; }
        label { display: block; color: var(--text-sub); font-size: 0.85rem; margin-bottom: 8px; font-weight: 600; }
        input, select, textarea {
            width: 100%; padding: 14px; 
            border: 2px solid #f1f5f9; border-radius: 12px;
            font-size: 1rem; background: #f8fafc; color: var(--text-main); outline: none; font-family: 'Plus Jakarta Sans'; font-weight: 500;
        }
        input:focus, textarea:focus { border-color: var(--primary); background: white; }

        .upi-apps { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-bottom: 15px; }
        .app-btn {
            background: white; border: 1px solid var(--border); padding: 10px; border-radius: 12px;
            text-align: center; cursor: pointer; transition: 0.2s;
        }
        .app-btn img { height: 25px; object-fit: contain; }
        .app-btn:active { transform: scale(0.95); background: #f1f5f9; }

        /* --- GAMES SECTION --- */
        .game-area { text-align: center; padding: 20px; background: #f8fafc; border-radius: 12px; margin-top: 20px; }
        .game-score { font-size: 2rem; font-weight: 800; color: var(--primary); margin: 10px 0; }
        .btn-clicker { 
            width: 100px; height: 100px; border-radius: 50%; background: var(--primary); color: white; border: none; font-weight: 800; font-size: 1.2rem; cursor: pointer; box-shadow: 0 10px 20px rgba(37, 99, 235, 0.3); transition: transform 0.1s;
        }
        .btn-clicker:active { transform: scale(0.9); }

    </style>
</head>
<body>

    <nav>
        <div class="logo"><i class="fa-solid fa-cube"></i> NEXUS</div>
        <div class="nav-controls">
            <button class="btn-game" onclick="openModal('gameModal')">🎮 Bored?</button>
            <button class="btn-create" onclick="openModal('sellerModal')">+ Seller</button>
        </div>
    </nav>

    <div class="filters">
        <div class="chip active" onclick="filterGame('All', this)">All Games</div>
        <div class="chip" onclick="filterGame('Free Fire', this)">🔥 Free Fire</div>
        <div class="chip" onclick="filterGame('PUBG', this)">🪖 PUBG</div>
        <div class="chip" onclick="filterGame('Roblox', this)">🤖 Roblox</div>
    </div>

    <div class="container" id="gridArea">
        <div class="empty-state">
            <i class="fa-solid fa-circle-notch fa-spin" style="font-size:2rem; color:var(--primary);"></i>
            <p style="margin-top:15px;">Connecting to Live Market...</p>
        </div>
    </div>

    <div id="sellerModal" class="modal-overlay hidden">
        <div class="modal-box">
            <h2 style="margin-top:0;">Create Profile</h2>
            
            <div class="form-group">
                <label>Username</label>
                <input type="text" id="regName" placeholder="e.g. ProGamer">
            </div>

            <div class="form-group">
                <label>About You (Description)</label>
                <textarea id="regDesc" rows="2" placeholder="I am a grandmaster player..."></textarea>
            </div>
            
            <div class="form-group">
                <label>Game</label>
                <select id="regGame">
                    <option value="Free Fire">Free Fire</option>
                    <option value="PUBG">PUBG Mobile</option>
                    <option value="Roblox">Roblox</option>
                </select>
            </div>

            <div class="form-group">
                <label>Price (Amount Only)</label>
                <input type="number" id="regPrice" placeholder="e.g. 150">
            </div>

            <div style="background:#f0f9ff; padding:15px; border-radius:12px; border:1px solid #bae6fd; margin-bottom:20px;">
                <label style="color:#0369a1;">Payment Setup (UPI ID)</label>
                <input type="text" id="regUPI" placeholder="e.g. name@okhdfcbank" style="margin-top:5px;">
            </div>

            <button class="btn-hire" onclick="addSeller()">Launch Profile</button>
            <button onclick="closeModal('sellerModal')" style="width:100%; background:none; border:none; padding:15px; color:var(--text-sub); cursor:pointer;">Cancel</button>
        </div>
    </div>

    <div id="payModal" class="modal-overlay hidden">
        <div class="modal-box">
            <h2 style="margin-top:0;">Secure Payment</h2>
            <div style="background:#fef2f2; border:1px solid #fee2e2; color:#b91c1c; padding:10px; border-radius:8px; font-size:0.8rem; margin-bottom:20px; font-weight:600;">
                <i class="fa-solid fa-shield-halved"></i> DISCLAIMER: We Handle The Payment Only. If It's A Fraud It Is Not Our Fault.
            </div>

            <div id="payContent" style="text-align:center; margin-bottom:20px;"></div>

            <div class="form-group">
                <label>Enter UTR / Transaction ID (12 Digits)</label>
                <input type="number" id="txnId" placeholder="e.g. 321456789012">
            </div>
            
            <button class="btn-hire" id="verifyBtn" onclick="verifyPay()">Verify & Pay</button>
            <button onclick="closeModal('payModal')" style="width:100%; background:none; border:none; padding:15px; color:var(--text-sub); cursor:pointer;">Cancel</button>
        </div>
    </div>

    <div id="gameModal" class="modal-overlay hidden">
        <div class="modal-box" style="text-align:center;">
            <h2 style="margin-top:0;">Waiting Room</h2>
            <p style="color:var(--text-sub);">Don't get bored waiting for customers!</p>
            
            <div class="game-area">
                <p>CLICKER CHALLENGE</p>
                <div class="game-score" id="clickScore">0</div>
                <button class="btn-clicker" onclick="addScore()">TAP!</button>
            </div>
            
            <button onclick="closeModal('gameModal')" style="width:100%; margin-top:20px; background:none; border:none; color:var(--text-sub); cursor:pointer;">Close Game</button>
        </div>
    </div>

    <script>
        // ============================================
        // FIREBASE CONFIGURATION (Use your Keys)
        // ============================================
        const firebaseConfig = {
            apiKey: "AIzaSyDQdp3EpE3XhmadNl5O-jDFO6rR-DJajm4",
            authDomain: "nexus-market-174ea.firebaseapp.com",
            projectId: "nexus-market-174ea",
            storageBucket: "nexus-market-174ea.firebasestorage.app",
            messagingSenderId: "884429922908",
            appId: "1:884429922908:web:e7119709ea4bf379297c99",
            measurementId: "G-46ZYN1HLQ6"
        };

        // Initialize
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        let sellers = [];
        let mySellerId = localStorage.getItem('nexus_my_id');
        let activeSellerId = null;
        let currentFilter = 'All';

        // --- 1. ONLINE / OFFLINE LOGIC ---
        // If I have a profile, set me Online immediately
        if(mySellerId) {
            db.collection("sellers").doc(mySellerId).update({ status: 'online' }).catch(e => console.log("Profile not found or deleted"));
            
            // Set Offline on close
            window.addEventListener('beforeunload', () => {
                db.collection("sellers").doc(mySellerId).update({ status: 'offline' });
            });

            // Set Offline on visibility change (Mobile Background)
            document.addEventListener('visibilitychange', () => {
                const status = document.hidden ? 'offline' : 'online';
                db.collection("sellers").doc(mySellerId).update({ status: status });
            });
            
            // Request Notification Permission
            if("Notification" in window) {
                Notification.requestPermission();
            }
        }

        // --- 2. REAL-TIME SYNC ---
        db.collection("sellers").orderBy("timestamp", "desc").onSnapshot((snapshot) => {
            sellers = [];
            snapshot.forEach((doc) => {
                sellers.push({ id: doc.id, ...doc.data() });
            });
            renderSellers();
        });

        // --- 3. RENDER ---
        function renderSellers() {
            const grid = document.getElementById('gridArea');
            grid.innerHTML = '';

            const filtered = sellers.filter(s => currentFilter === 'All' || s.game === currentFilter);

            if (filtered.length === 0) {
                grid.innerHTML = `<div class="empty-state"><h3>No Sellers Online</h3><p>Be the first to join!</p></div>`;
                return;
            }

            filtered.forEach(s => {
                // Verified Badge Logic (Rating > 4.5 or manually set)
                const isVerified = s.rating >= 4.5 || s.verified === true;
                const verifiedHtml = isVerified ? `<i class="fa-solid fa-circle-check verified-badge" title="Trusted Seller"></i>` : '';

                const statusClass = s.status === 'online' ? 'st-online' : 'st-offline';
                const statusText = s.status === 'online' ? 'ONLINE' : 'OFFLINE';

                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <div class="card-header">
                        <div class="user-block">
                            <div class="avatar">${s.name.charAt(0).toUpperCase()}</div>
                            <div>
                                <h3 style="margin:0; font-size:1.1rem; display:flex; align-items:center;">
                                    ${s.name} ${verifiedHtml}
                                </h3>
                                <span style="font-size:0.85rem; color:var(--text-sub);">${s.game}</span>
                            </div>
                        </div>
                        <div class="status-dot ${statusClass}"><div class="dot"></div> ${statusText}</div>
                    </div>
                    <div class="desc-text">${s.desc || "No description provided."}</div>
                    <div class="price-row">
                        <div class="price">₹${s.price}</div>
                        <div class="rating-box">★ ${s.rating ? s.rating.toFixed(1) : 'NEW'}</div>
                    </div>
                    <button class="btn-hire" onclick="openPay('${s.id}')">Hire Now</button>
                `;
                grid.appendChild(card);
            });
        }

        // --- 4. ADD SELLER ---
        function addSeller() {
            const name = document.getElementById('regName').value;
            const desc = document.getElementById('regDesc').value;
            const price = document.getElementById('regPrice').value;
            const game = document.getElementById('regGame').value;
            const upi = document.getElementById('regUPI').value;

            if(!name || !price || !upi) return alert("Fill all details.");

            db.collection("sellers").add({
                name, desc, price, game, upi,
                status: 'online',
                rating: 0, reviews: 0,
                timestamp: Date.now()
            }).then((docRef) => {
                mySellerId = docRef.id;
                localStorage.setItem('nexus_my_id', mySellerId); // Save ID to manage status
                closeModal('sellerModal');
            });
        }

        // --- 5. PAYMENT & NOTIFICATION ---
        function openPay(id) {
            activeSellerId = id;
            const s = sellers.find(x => x.id === id);
            document.getElementById('payModal').classList.remove('hidden');
            const content = document.getElementById('payContent');

            const link = `upi://pay?pa=${s.upi}&pn=${s.name}&am=${s.price}&cu=INR`;
            const qrUrl = `https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=${encodeURIComponent(link)}`;

            content.innerHTML = `
                <div style="font-weight:bold; font-size:1.2rem; margin-bottom:10px;">Pay ₹${s.price}</div>
                <img src="${qrUrl}" style="border-radius:12px; border:1px solid #eee; padding:5px; margin-bottom:15px;" alt="QR Code">
                <div class="upi-apps">
                    <a href="${link}" class="app-btn"><img src="https://upload.wikimedia.org/wikipedia/commons/f/f2/Google_Pay_Logo.svg"><div>GPay</div></a>
                    <a href="${link}" class="app-btn"><img src="https://upload.wikimedia.org/wikipedia/commons/thumb/c/c1/PhonePe_Logo.svg/2560px-PhonePe_Logo.svg.png"><div>PhonePe</div></a>
                    <a href="${link}" class="app-btn"><img src="https://assetscdn1.paytm.com/images/catalog/view/310944/1697527183231.png"><div>Paytm</div></a>
                </div>
            `;
        }

        function verifyPay() {
            const val = document.getElementById('txnId').value.trim();
            if(!/^[0-9]{12}$/.test(val)) return alert("Invalid UTR (12 Digits required)");

            document.getElementById('verifyBtn').innerText = "Verifying...";
            
            // SEND NOTIFICATION LOGIC
            // In a real backend, we would trigger a Push Notification here. 
            // Since this is P2P via Firestore, we can assume the seller is listening.
            
            setTimeout(() => {
                alert("Payment Verified! Opening Chat...");
                closeModal('payModal');
                
                // Simulate Notification for Demo Purpose (If I was the seller)
                if(Notification.permission === "granted") {
                    new Notification("New Order!", { body: "A user has hired you. Click to chat." });
                }
            }, 2000);
        }

        // --- 6. MINI GAME ---
        let score = 0;
        function addScore() {
            score++;
            document.getElementById('clickScore').innerText = score;
        }

        // Utils
        function openModal(id) { document.getElementById(id).classList.remove('hidden'); }
        function closeModal(id) { document.getElementById(id).classList.add('hidden'); }
        function filterGame(g, el) { currentFilter = g; document.querySelectorAll('.chip').forEach(c => c.classList.remove('active')); el.classList.add('active'); renderSellers(); }

    </script>
</body>
</html>
