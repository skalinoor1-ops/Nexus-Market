<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NEXUS | Admin Master</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

    <style>
        :root { --primary: #2563eb; --danger: #ef4444; --bg: #f8fafc; --radius: 16px; }
        body { margin: 0; font-family: 'Plus Jakarta Sans', sans-serif; background: var(--bg); overflow-x: hidden; }
        
        /* HEADER */
        nav { background: white; padding: 12px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #e2e8f0; position: sticky; top:0; z-index: 100; }
        
        /* CARDS */
        .container { padding: 15px; max-width: 600px; margin: 0 auto; }
        .card { background: white; border-radius: var(--radius); margin-bottom: 20px; border: 1px solid #e2e8f0; box-shadow: 0 4px 15px rgba(0,0,0,0.03); overflow: hidden; }
        .card-top { padding: 18px; }
        .status-pill { font-size: 0.65rem; font-weight: 800; padding: 2px 8px; border-radius: 50px; }
        .online { background: #dcfce7; color: #15803d; }
        .offline { background: #f1f5f9; color: #64748b; }

        /* SPLIT ACTION */
        .card-footer { display: flex; border-top: 1px solid #f1f5f9; }
        .btn-foot { flex: 1; padding: 14px; border: none; font-weight: 700; cursor: pointer; font-size: 0.8rem; }
        .btn-hire { background: var(--primary); color: white; }
        .btn-rev { background: #f8fafc; color: #64748b; border-left: 1px solid #f1f5f9; }

        /* MODALS */
        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 1000; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .modal { background: white; padding: 25px; border-radius: 24px; width: 100%; max-width: 400px; max-height: 85vh; overflow-y: auto; }
        .hidden { display: none !important; }
        
        /* ADMIN CONTROLS */
        .admin-item { background: #f1f5f9; margin-bottom: 10px; padding: 10px; border-radius: 10px; font-size: 0.8rem; display: flex; justify-content: space-between; align-items: center; }
        
        /* JUMP SCARE / GLOBAL MSG */
        #globalMsg { position: fixed; top: 20%; left: 0; width: 100%; text-align: center; background: rgba(239, 68, 68, 0.9); color: white; padding: 20px; font-weight: 900; z-index: 9999; transform: scale(0); transition: 0.3s; }
        #jumpScare { position: fixed; inset: 0; background: url('https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExM3N2eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4JmVwPXYxX2ludGVybmFsX2dpZl9ieV9pZCZjdD1n/14ut8o6O9cmE0/giphy.gif') center no-repeat; background-size: cover; z-index: 10000; display: none; }
    </style>
</head>
<body>

    <div id="jumpScare"></div>
    <div id="globalMsg">ADMIN MESSAGE: <br><span id="msgContent"></span></div>

    <nav>
        <div id="logo" style="font-weight: 900; color: var(--primary); font-size: 1.3rem; cursor: pointer;" onclick="adminTap()">NEXUS</div>
        <div id="userTag" style="font-weight: 700; font-size: 0.7rem;">Loading...</div>
    </nav>

    <div class="container">
        <button class="btn-foot btn-hire" style="width:100%; border-radius:12px; margin-bottom:20px;" onclick="openModal('sellerModal')">+ CREATE OFFER</button>
        <div id="marketGrid"></div>
    </div>

    <div id="adminModal" class="modal-overlay hidden">
        <div class="modal">
            <h2 style="color:var(--danger); margin-top:0;">OWNER CONSOLE</h2>
            <div style="margin-bottom:20px;">
                <input type="text" id="admMsg" placeholder="Write Text on Screen..." style="width:70%; padding:10px;">
                <button onclick="sendGlobalMsg()" style="padding:10px;">Send</button>
            </div>
            <div id="adminUserList"></div>
            <button class="btn-foot btn-rev" style="width:100%; margin-top:10px;" onclick="closeModal('adminModal')">Exit Console</button>
        </div>
    </div>

    <div id="payModal" class="modal-overlay hidden">
        <div class="modal" style="text-align: center;">
            <div id="qrArea"></div>
            <h3 id="payTitle"></h3>
            <button class="btn-foot btn-hire" style="width:100%; border-radius:10px;" onclick="closeModal('payModal')">I Paid / Close</button>
        </div>
    </div>

    <div id="sellerModal" class="modal-overlay hidden">
        <div class="modal">
            <h3>New Service</h3>
            <select id="regGame"><option value="Free Fire">Free Fire</option><option value="PUBG">PUBG</option><option value="Roblox">Roblox</option></select>
            <input type="number" id="regPrice" placeholder="Price ₹">
            <input type="text" id="regUPI" placeholder="UPI ID">
            <button class="btn-foot btn-hire" style="width:100%; border-radius:10px;" onclick="createOffer()">Post</button>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDQdp3EpE3XhmadNl5O-jDFO6rR-DJajm4",
            authDomain: "nexus-market-174ea.firebaseapp.com",
            projectId: "nexus-market-174ea",
            storageBucket: "nexus-market-174ea.firebasestorage.app",
            messagingSenderId: "884429922908",
            appId: "1:884429922908:web:e7119709ea4bf379297c99"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        let currentUser = localStorage.getItem('nexus_user') || prompt("Enter Name:");
        if(currentUser) { localStorage.setItem('nexus_user', currentUser); document.getElementById('userTag').innerText = currentUser; }

        let clicks = 0;
        function adminTap() {
            clicks++;
            setTimeout(() => clicks = 0, 1000);
            if(clicks === 2) {
                const p = prompt("Secret Key:");
                if(p === "nexus789") openModal('adminModal'), loadAdminUsers();
            }
        }

        // --- CORE MARKET ---
        db.collection("sellers").orderBy("timestamp", "desc").onSnapshot(snap => {
            const grid = document.getElementById('marketGrid');
            grid.innerHTML = '';
            snap.forEach(doc => {
                const s = doc.data();
                const isMe = s.name === currentUser;
                grid.innerHTML += `
                    <div class="card">
                        <div class="card-top">
                            <div style="display:flex; justify-content:space-between;">
                                <strong>${s.name} ${s.verified ? '🔵' : ''}</strong>
                                <span class="status-pill ${s.status}">${s.status}</span>
                            </div>
                            <div style="font-size:1.3rem; font-weight:800; margin:10px 0;">₹${s.price}</div>
                            <small>${s.game}</small>
                        </div>
                        <div class="card-footer">
                            ${isMe ? `<button class="btn-foot btn-rev" style="color:red" onclick="db.collection('sellers').doc('${doc.id}').delete()">DELETE</button>` : 
                                     `<button class="btn-foot btn-hire" onclick="openPay('${s.upi}', '${s.price}', '${s.name}')">HIRE</button>
                                      <button class="btn-foot btn-rev">REVIEW</button>`}
                        </div>
                    </div>`;
            });
        });

        // --- ADMIN SYSTEMS ---
        function loadAdminUsers() {
            db.collection("sellers").onSnapshot(snap => {
                const list = document.getElementById('adminUserList');
                list.innerHTML = '';
                snap.forEach(doc => {
                    const s = doc.data();
                    list.innerHTML += `<div class="admin-item">
                        <span>${s.name}</span>
                        <div>
                            <button onclick="triggerJump('${s.name}')">😱</button>
                            <button onclick="db.collection('sellers').doc('${doc.id}').update({verified: true})">🔵</button>
                            <button onclick="db.collection('sellers').doc('${doc.id}').delete()">🗑️</button>
                        </div>
                    </div>`;
                });
            });
        }

        // --- REAL TIME LISTENERS (For Ban / JumpScare / Msg) ---
        db.collection("commands").doc("global").onSnapshot(doc => {
            const data = doc.data();
            if(data && data.msg) {
                const box = document.getElementById('globalMsg');
                document.getElementById('msgContent').innerText = data.msg;
                box.style.transform = "scale(1)";
                setTimeout(() => box.style.transform = "scale(0)", 5000);
            }
        });

        db.collection("commands").doc(currentUser).onSnapshot(doc => {
            if(doc.exists && doc.data().jump) {
                const j = document.getElementById('jumpScare');
                j.style.display = 'block';
                setTimeout(() => { j.style.display = 'none'; db.collection("commands").doc(currentUser).delete(); }, 2000);
            }
        });

        // --- ACTIONS ---
        function sendGlobalMsg() { db.collection("commands").doc("global").set({ msg: document.getElementById('admMsg').value }); }
        function triggerJump(name) { db.collection("commands").doc(name).set({ jump: true }); }
        
        function openPay(upi, amt, name) {
            const link = `upi://pay?pa=${upi}&pn=${name}&am=${amt}&cu=INR`;
            document.getElementById('qrArea').innerHTML = `<img src="https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=${encodeURIComponent(link)}">`;
            document.getElementById('payTitle').innerText = `Pay ₹${amt}`;
            openModal('payModal');
        }

        function createOffer() {
            db.collection("sellers").add({
                name: currentUser, price: document.getElementById('regPrice').value,
                upi: document.getElementById('regUPI').value, game: document.getElementById('regGame').value,
                status: 'online', verified: false, timestamp: Date.now()
            });
            closeModal('sellerModal');
        }

        function openModal(id) { document.getElementById(id).classList.remove('hidden'); }
        function closeModal(id) { document.getElementById(id).classList.add('hidden'); }
    </script>
</body>
</html>
